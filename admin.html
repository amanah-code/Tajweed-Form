<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Al Amanah Admin</title>
<style>
  :root{--gold:#b98f5c;--gold-d:#9d7646;--gold-l:#f6efe4;--ink:#242424;--muted:#6b6660;--line:#e6dccb;--bg:#fcfaf6;--red:#b3261e;--green:#2e7d32;--wa:#25a244}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 60px}
  h1{font-size:1.1rem;margin:6px 0 10px;color:var(--gold-d);letter-spacing:.08em;text-transform:uppercase}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{flex:1;min-width:100px;padding:10px 8px;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;cursor:pointer}
  .tabs button.on{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
  .name{font-weight:600}
  .meta{color:var(--muted);font-size:.9rem}
  .why{margin-top:6px;font-size:.9rem;color:var(--red)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  button.act{border:0;border-radius:999px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
  .send{background:var(--wa);color:#fff}
  .ghost{background:#fff;color:var(--gold-d);border:2px solid var(--gold)!important}
  .danger{background:#fff;color:var(--red);border:2px solid var(--red)!important}
  button:disabled{opacity:.5}
  .note{padding:10px 12px;border-radius:10px;background:var(--gold-l);margin:8px 0;font-size:.95rem}
  .err{background:#fdecea;color:var(--red)}
  input[type=file]{font-size:.9rem;max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Al Amanah Admin</h1>
  <div class="note" id="top">Loading&hellip;</div>
  <div class="tabs" id="tabs">
    <button data-t="ready">Ready</button>
    <button data-t="attention">Needs attention</button>
    <button data-t="sent">Sent</button>
    <button id="refresh">&#8635; Refresh</button>
  </div>
  <div id="list"></div>
</div>

<script src="lame.min.js"></script>
<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyHaRaT-einiBjMzFRQ5EVBlvHfu5wWKNkuu8Ks3fzbt2FSy_gMStJSInRKVupw1l21/exec';
const KEY = new URLSearchParams(location.search).get('key');
// The WhatsApp message. {NAME} and {LINK} are filled in for each student. Edit the words freely.
const MESSAGE = "Assalamu alaikum {NAME} 🌙\n\nYour free Tajweed assessment result is ready. Please open the link below to listen to your teacher's audio feedback and see your result:\n\n{LINK}\n\nIf you have any questions, just reply here.\n\nAl Amanah International Academy";

const $ = id => document.getElementById(id);
let items = [], tab = 'ready';

function phoneNum(p){
  let d = String(p||'').replace(/\D/g,'');
  if (d.length === 10) return '91' + d;
  if (d.length === 11 && d[0] === '0') return '91' + d.slice(1);
  return d.length >= 11 ? d : '';
}
function status(it){
  if (it.sent) return 'sent';
  if (it.audio === 'OK' && it.token && it.hasReport) return 'ready';
  return 'attention';
}
function why(it){
  const w = [];
  if (it.audio !== 'OK') w.push(it.audio ? ('Audio: ' + it.audio) : 'No teacher audio yet');
  if (!it.hasReport) w.push('Result text is missing');
  return w.join(' · ');
}
function link(it){ return new URL('result.html?t=' + it.token, location.href).href; }

async function post(obj, ms){
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), ms || 120000);
  try {
    const r = await fetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ key: KEY }, obj)), signal: ac.signal });
    return JSON.parse(await r.text());
  } finally { clearTimeout(tm); }
}

async function load(){
  if (!KEY){ $('top').textContent = 'Open this page with your admin key: admin.html?key=YOUR-KEY'; $('top').className = 'note err'; return; }
  $('top').textContent = 'Loading…'; $('top').className = 'note';
  try {
    const r = await fetch(ENDPOINT + '?action=admin_list&key=' + encodeURIComponent(KEY));
    const d = JSON.parse(await r.text());
    if (!d.ok) throw new Error(d.error || 'error');
    items = d.items; $('top').hidden = true; render();
  } catch(e){ $('top').hidden = false; $('top').textContent = 'Could not load: ' + e.message; $('top').className = 'note err'; }
}

function render(){
  const g = { ready:[], attention:[], sent:[] };
  items.forEach(it => g[status(it)].push(it));
  document.querySelectorAll('#tabs button[data-t]').forEach(b => {
    const t = b.dataset.t; b.textContent = ({ready:'Ready',attention:'Needs attention',sent:'Sent'})[t] + ' (' + g[t].length + ')';
    b.className = t === tab ? 'on' : '';
  });
  const box = $('list'); box.innerHTML = '';
  if (!g[tab].length){ const n = document.createElement('div'); n.className = 'note'; n.textContent = 'Nothing here.'; box.appendChild(n); return; }
  g[tab].forEach(it => box.appendChild(card(it)));
}

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function card(it){
  const c = el('div', 'card');
  c.appendChild(el('div', 'name', it.name));
  c.appendChild(el('div', 'meta', (it.phone || 'no number') + (it.sent ? ' · sent ' + it.sent : '')));
  const st = status(it);
  if (st === 'attention') c.appendChild(el('div', 'why', why(it)));
  const row = el('div', 'row'); c.appendChild(row);
  const msg = el('div', 'meta'); msg.style.marginTop = '8px'; c.appendChild(msg);

  if (st !== 'attention' || (it.audio === 'OK' && it.token && !it.hasReport)) {
    // nothing to send if result text is missing
  }
  if (st === 'ready' || st === 'sent'){
    const b = el('button', 'act send', st === 'sent' ? 'Send again on WhatsApp' : 'Send on WhatsApp');
    b.onclick = () => {
      const num = phoneNum(it.phone);
      if (!num){ msg.textContent = 'The phone number looks wrong. Fix it in the sheet.'; return; }
      const text = MESSAGE.replace('{NAME}', it.name.trim().split(/\s+/)[0]).replace('{LINK}', link(it));
      window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(text), '_blank');
      post({ action:'admin_sent', row: it.row, name: it.name }).then(d => { if (d.ok){ it.sent = new Date().toISOString().slice(0,16).replace('T',' '); render(); } }).catch(()=>{});
    };
    row.appendChild(b);
  }

  // replace / upload audio
  const lab = el('label', 'meta', st === 'attention' && it.audio !== 'OK' ? 'Upload teacher audio: ' : 'Replace audio: ');
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'audio/*,.opus,.ogg,.m4a,.mp3,.wav';
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    inp.disabled = true; msg.textContent = 'Preparing the audio…';
    try {
      const out = await prepare(inp.files[0]);
      msg.textContent = 'Uploading… keep this page open.';
      const d = await post({ action:'admin_audio_upload', row: it.row, name: it.name, ext: out.ext, audio: out.b64 }, 150000);
      if (!d.ok) throw new Error(d.error || 'error');
      msg.textContent = 'Saved. Audio check: ' + d.status; await load();
    } catch(e){ msg.textContent = 'Failed: ' + e.message; inp.disabled = false; }
  };
  lab.appendChild(inp); row.appendChild(lab);

  if (it.audio && it.audio !== 'MISSING' && it.audio !== 'OK'){
    const rm = el('button', 'act danger', 'Remove audio');
    rm.onclick = async () => {
      if (!confirm('Remove this audio link for ' + it.name + '?')) return;
      rm.disabled = true;
      try { const d = await post({ action:'admin_audio_remove', row: it.row, name: it.name }); if (!d.ok) throw new Error(d.error); await load(); }
      catch(e){ msg.textContent = 'Failed: ' + e.message; rm.disabled = false; }
    };
    row.appendChild(rm);
  }
  return c;
}

/* ---- audio: make a small MP3 (falls back to the original file) ---- */
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
function rawExt(f){
  const e = (f.name.split('.').pop() || '').toLowerCase();
  if (e === 'opus') return 'ogg'; if (e === 'aac') return 'm4a';
  return ['mp3','m4a','webm','ogg','wav'].includes(e) ? e : 'ogg';
}
async function prepare(file){
  try {
    if (!window.lamejs) throw 0;
    const ab = await file.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
    const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.catch) p.catch(rej); });
    try { ctx.close(); } catch(e){}
    const n = buf.numberOfChannels, len = buf.length, mono = new Float32Array(len);
    for (let c = 0; c < n; c++){ const d = buf.getChannelData(c); for (let i = 0; i < len; i++) mono[i] += d[i] / n; }
    const RATE = 16000, r = buf.sampleRate / RATE, m = Math.floor(len / r), ds = new Float32Array(m);
    for (let i = 0; i < m; i++){ const a = Math.floor(i*r), e = Math.min(Math.floor((i+1)*r), len); let s = 0; for (let j = a; j < e; j++) s += mono[j]; ds[i] = s / Math.max(1, e - a); }
    const pcm = new Int16Array(m);
    for (let i = 0; i < m; i++){ const s = Math.max(-1, Math.min(1, ds[i])); pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF; }
    const enc = new lamejs.Mp3Encoder(1, RATE, 48), parts = [];
    for (let i = 0, k = 0; i < pcm.length; i += 11520, k++){
      const b = enc.encodeBuffer(pcm.subarray(i, i + 11520)); if (b.length) parts.push(new Int8Array(b));
      if (k % 20 === 0) await new Promise(r => setTimeout(r, 0));
    }
    const last = enc.flush(); if (last.length) parts.push(new Int8Array(last));
    return { ext:'mp3', b64: await toB64(new Blob(parts, { type:'audio/mpeg' })) };
  } catch(e){
    return { ext: rawExt(file), b64: await toB64(file) };
  }
}

document.querySelectorAll('#tabs button[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
$('refresh').onclick = load;
load();
</script>
</body>
</html>
